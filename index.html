<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my text</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="theme-purple">

  <!-- ナビゲーションバー -->
  <nav class="navbar">
    <div class="nav-container">
      <h1 class="logo">my text</h1>
      <div class="nav-links">
        <button class="nav-item active" onclick="switchTab('home')">ホーム</button>
        <button class="nav-item" onclick="switchTab('add')">問題追加</button>
        <button class="nav-item" onclick="switchTab('review')">復習</button>
        <button class="nav-item" onclick="switchTab('analytics')">学習分析</button>
        <button class="nav-item" onclick="switchTab('mypage')">マイページ</button>
      </div>
    </div>
  </nav>

  <!-- カスタム通知トースト -->
  <div id="toast-notification" class="toast"></div>

  <main class="container">

    <!-- ==================== TAB 1: HOME ==================== -->
    <section id="tab-home" class="tab-content active">
      
      <!-- 目標設定エリア -->
      <div class="goals-container">
        <!-- 大目標 -->
        <div class="apple-card main-goal-card">
          <div class="goal-header">
            <h3>大きな目標</h3>
            <button class="btn btn-secondary btn-sm" onclick="toggleGoalEdit('main')">編集</button>
          </div>
          <div class="goal-content">
            <span id="main-goal-date" class="date-badge">期日未定</span>
            <p id="main-goal-display" class="goal-text">目標が設定されていません</p>
          </div>
          <div id="main-goal-edit" class="goal-edit-form" style="display:none; margin-top:12px; flex-direction:column; gap:6px;">
            <input type="date" id="main-goal-date-input" class="apple-input">
            <input type="text" id="main-goal-input" class="apple-input" placeholder="例: 資格試験に合格する！">
            <div style="display:flex; gap:6px; margin-top:4px;">
              <button class="btn btn-primary btn-sm" style="flex:1;" onclick="saveMainGoal()">保存</button>
              <button class="btn btn-danger btn-sm" onclick="clearMainGoal()">目標を消去</button>
            </div>
          </div>
        </div>

        <!-- ミニ目標 -->
        <div class="apple-card mini-goal-card">
          <div class="goal-header">
            <h3>直近のミニ目標</h3>
            <button class="btn btn-secondary btn-sm" style="color:#6366f1; background:#ffffff;" onclick="toggleGoalEdit('mini')">+ 追加</button>
          </div>
          
          <div id="mini-goals-list" class="mini-goals-list"></div>

          <div id="mini-goal-edit" class="goal-edit-form" style="display:none; margin-top:12px; background: rgba(255,255,255,0.2); padding: 12px; border-radius: 12px; backdrop-filter: blur(5px);">
            <input type="date" id="mini-goal-date-input" class="apple-input" style="margin-bottom:6px;">
            <input type="text" id="mini-goal-text-input" class="apple-input" placeholder="例: 文法問題を50問解く">
            <button class="btn btn-primary btn-sm" style="background:#ffffff; color:#6366f1; margin-top:6px; width:100%;" onclick="addMiniGoal()">追加する</button>
          </div>
        </div>
      </div>

      <!-- 検索・フィルターバー -->
      <div class="apple-card search-card">
        <div class="search-row">
          <input type="text" id="search-input" class="apple-input" placeholder="問題タイトルやメモで検索..." oninput="renderQuestions()">
          <select id="filter-subject" class="apple-input" onchange="renderQuestions()">
            <option value="">すべての科目</option>
          </select>
          <select id="filter-folder" class="apple-input" onchange="renderQuestions()">
            <option value="">すべてのフォルダ</option>
          </select>
        </div>
      </div>

      <!-- 問題一覧リスト（ホーム） -->
      <h3 style="margin-bottom: 14px; font-size:1.1rem; font-weight:700; color:#1e293b;">問題一覧</h3>
      <div id="questions-list" class="card-grid"></div>
    </section>

    <!-- ==================== TAB 2: ADD QUESTION ==================== -->
    <section id="tab-add" class="tab-content">
      <div class="apple-card form-card">
        <h2 style="margin-bottom:1.2rem; color:#4f46e5;">問題の登録・編集</h2>
        <form id="question-form" onsubmit="handleSaveQuestion(event)">
          <input type="hidden" id="edit-id">

          <div class="form-group">
            <label>タイトル *</label>
            <input type="text" id="q-title" class="apple-input" required placeholder="例: 関係代名詞thatとwhichの使い分け">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>科目 *</label>
              <input type="text" id="q-subject" class="apple-input" placeholder="例: 英語" required>
            </div>
            <div class="form-group">
              <label>サブジャンル (分野)</label>
              <input type="text" id="q-field" class="apple-input" placeholder="例: 文法">
            </div>
          </div>

          <div class="form-group">
            <label>問題画像</label>
            <input type="file" id="q-image-file" class="apple-input" accept="image/*" multiple onchange="handleImageUpload(event)">
            <div id="image-loading-spinner" style="display:none; color:#4f46e5; font-size:0.85rem; margin-top:5px; font-weight:bold;">画像を軽量化処理中...</div>
            <div id="image-preview" class="thumb-preview-container"></div>
          </div>

          <div class="form-group">
            <label>メモ</label>
            <textarea id="q-memo" class="apple-input" rows="5" placeholder="問題のポイント、解説、暗記項目などを記入"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>重要度・ラベル</label>
              <select id="q-label" class="apple-input">
                <option value="">なし</option>
                <option value="基礎">基礎</option>
                <option value="重要">重要</option>
                <option value="応用">応用</option>
              </select>
            </div>
            <div class="form-group">
              <label>タグ (カンマ区切り)</label>
              <input type="text" id="q-tags" class="apple-input" placeholder="文法, 単語">
            </div>
          </div>

          <div class="form-group">
            <label>フォルダを選択</label>
            <select id="q-folders" class="apple-input" multiple style="height:80px;"></select>
          </div>

          <div style="display:flex; gap:12px; margin-top:1.8rem;">
            <button type="submit" class="btn btn-primary" style="flex:1;">保存する</button>
            <button type="button" class="btn btn-secondary" onclick="resetForm(); switchTab('home');">キャンセル</button>
          </div>
        </form>
      </div>
    </section>

    <!-- ==================== TAB 3: REVIEW ==================== -->
    <section id="tab-review" class="tab-content">
      <div class="apple-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <h2 style="color:#ec4899; margin:0;" id="review-header-title">復習モード（科目選択）</h2>
          <button id="review-back-btn" class="btn btn-secondary btn-sm" style="display:none;" onclick="renderReviewSubjectFolders()">← 科目一覧に戻る</button>
        </div>
        
        <!-- フィルタータグ -->
        <div id="review-segment-controls" class="segment-control" style="display:none; margin-top:10px;">
          <button class="seg-btn active" onclick="filterReviewList('all', this)">すべて</button>
          <button class="seg-btn" onclick="filterReviewList('due', this)">本日復習</button>
          <button class="seg-btn" onclick="filterReviewList('incorrect', this)">苦手問題</button>
          <button class="seg-btn" onclick="filterReviewList('bedtime', this)">寝る前</button>
          <button class="seg-btn" onclick="filterReviewList('exam', this)">直前チェック</button>
        </div>
      </div>

      <!-- 科目選択エリア -->
      <div id="review-subject-grid" class="folder-grid"></div>

      <!-- 横長問題リストエリア -->
      <div id="review-compact-list" class="compact-list-container" style="display:none;"></div>
    </section>

    <!-- ==================== TAB 4: ANALYTICS ==================== -->
    <section id="tab-analytics" class="tab-content">
      <div class="apple-card chart-card">
        <h3 style="color:#10b981; margin-bottom:12px;">科目別理解度グラフ</h3>
        <div class="chart-container">
          <canvas id="subjectChart"></canvas>
        </div>
      </div>

      <div class="apple-card">
        <h3 style="color:#4f46e5; margin-bottom:12px;">学習履歴ログ</h3>
        <div id="analytics-log-list" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>
    </section>

    <!-- ==================== TAB 5: MY PAGE ==================== -->
    <section id="tab-mypage" class="tab-content">
      
      <!-- 累計学習実績 -->
      <div class="apple-card">
        <h2 style="color:#4f46e5; margin-bottom:16px;">マイページ</h2>
        <div class="stat-card">
          <div class="stat-label">累計の解いた問題数</div>
          <div class="stat-value" id="total-solved-count">0 <span style="font-size:1.2rem; color:#64748b;">回</span></div>
        </div>
      </div>

      <!-- 設定エリア -->
      <div class="apple-card">
        <h3 style="color:#3b82f6; margin-bottom:12px;">設定</h3>
        
        <div class="form-group">
          <label>テーマの色</label>
          <div class="theme-selector">
            <button class="theme-btn theme-purple-btn" onclick="changeTheme('theme-purple')">紫</button>
            <button class="theme-btn theme-blue-btn" onclick="changeTheme('theme-blue')">青</button>
            <button class="theme-btn theme-cyan-btn" onclick="changeTheme('theme-cyan')">水色</button>
            <button class="theme-btn theme-green-btn" onclick="changeTheme('theme-green')">緑</button>
            <button class="theme-btn theme-yellow-btn" onclick="changeTheme('theme-yellow')">黄色</button>
            <button class="theme-btn theme-orange-btn" onclick="changeTheme('theme-orange')">オレンジ</button>
            <button class="theme-btn theme-red-btn" onclick="changeTheme('theme-red')">赤</button>
            <button class="theme-btn theme-pink-btn" onclick="changeTheme('theme-pink')">ピンク</button>
          </div>
        </div>

        <div style="margin-top: 24px; border-top: 1px solid rgba(0,0,0,0.06); padding-top: 16px;">
          <button class="btn btn-danger btn-sm" onclick="clearAllDataAndReset()">すべてのデータをリセット（全消去）</button>
        </div>
      </div>

    </section>

  </main>

  <!-- ==================== MODAL: REVIEW ==================== -->
  <div id="modal-review" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 id="modal-q-title">問題</h3>
        <button class="close-btn" onclick="closeReviewModal()">&times;</button>
      </div>
      <div id="modal-review-body" style="margin-top:15px;"></div>
    </div>
  </div>

  <!-- ==================== MODAL: FULLSCREEN IMAGE GALLERY VIEWER ==================== -->
  <div id="modal-image-viewer" class="image-viewer-overlay" style="display:none;" onclick="toggleViewerControls()">
    <button id="viewer-close-btn" class="image-viewer-close" onclick="event.stopPropagation(); closeImageViewer()">&times;</button>
    <button id="viewer-prev-btn" class="image-viewer-arrow left" onclick="event.stopPropagation(); prevImageViewer();">&#10094;</button>
    <div class="image-viewer-container">
      <img id="full-image-display" src="" alt="全画面表示画像">
    </div>
    <button id="viewer-next-btn" class="image-viewer-arrow right" onclick="event.stopPropagation(); nextImageViewer();">&#10095;</button>
    <div id="image-viewer-counter" class="image-viewer-counter"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
